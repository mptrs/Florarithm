    :root{
      --paper:oklch(0.968 0.008 85); --surface:oklch(0.995 0.003 85);

      --line-strong:oklch(0.800 0.012 80); --ink:oklch(0.255 0.014 65);
      --ink-muted:oklch(0.510 0.014 68); --ink-faint:oklch(0.655 0.012 72);
      --leaf:oklch(0.455 0.098 152); --leaf-tint:oklch(0.944 0.026 152);
      --water:oklch(0.455 0.104 236); --water-tint:oklch(0.944 0.028 236);
      --ember:oklch(0.520 0.130 47); --ember-tint:oklch(0.948 0.034 47);
      --on-accent:oklch(0.985 0.004 85);
      --display:'Newsreader',Georgia,'Times New Roman',serif;
      --ui:system-ui,-apple-system,'Segoe UI',sans-serif;
      --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
      --r-card:16px; --r-ctrl:12px;
    }
    body{margin:0;font-family:var(--ui);}
    a{color:var(--leaf);text-decoration:none;} a:hover{color:var(--ink);}
    .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
    .label{font-size:12px;line-height:16px;font-weight:600;letter-spacing:0.09em;
           text-transform:uppercase;color:var(--ink-faint);}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);}
    /* The dial fans out, holds, folds back. 4.4s loop so it reads on a canvas. */
    @keyframes fan{
      0%,4%    {transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}
      15%      {transform:translate(0,0) scale(1.07);opacity:1}
      21%,66%  {transform:translate(0,0) scale(1);opacity:1}
      78%,100% {transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}
    }
    @keyframes fade{0%,6%{opacity:0}20%,66%{opacity:1}78%,100%{opacity:0}}
    @keyframes iconOut{0%,8%{opacity:1;transform:rotate(0)}20%,70%{opacity:0;transform:rotate(90deg)}84%,100%{opacity:1;transform:rotate(0)}}
    @keyframes iconIn{0%,8%{opacity:0;transform:rotate(-90deg)}20%,70%{opacity:1;transform:rotate(0)}84%,100%{opacity:0;transform:rotate(-90deg)}}
    .sat{animation:fan 4.4s cubic-bezier(.34,1.4,.5,1) infinite both;}
    .scrim{animation:fade 4.4s ease infinite both;}
  </style>
</helmet>

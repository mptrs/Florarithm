<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,200..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    a { color: oklch(0.455 0.098 152); } a:hover { color: oklch(0.405 0.098 152); }
    .sc { font-size: 0.75rem; line-height: 1rem; letter-spacing: 0.09em; font-weight: 600; text-transform: uppercase; color: oklch(0.51 0.014 68); }
    .inp { display: flex; align-items: center; height: 48px; padding: 0 12px; border: 1px solid oklch(0.8 0.012 80); border-radius: 4px; background: oklch(0.995 0.003 85); font-size: 1rem; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: oklch(0.968 0.008 85); color: oklch(0.255 0.014 65); display: flex; flex-direction: column; overflow: hidden;">

  <div style="flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 28px; padding: 24px 20px 0 20px;">

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 8px; color: oklch(0.51 0.014 68);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v3"></path><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 11h8"></path><path d="M8 16h5"></path></svg>
        <span class="sc">Where it came from</span>
      </div>
      <div style="display: flex; gap: 12px;">
        <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 6px;"><span class="sc">From whom</span><div class="inp">Plantje.nl</div></div>
        <div style="width: 128px; display: flex; flex-direction: column; gap: 6px;"><span class="sc">Price</span><div class="inp">€ 42,50</div></div>
      </div>
    </div>

    <!-- Status: where a plant's ending already lives -->
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 8px; color: oklch(0.51 0.014 68);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        <span class="sc">Status</span>
      </div>
      <div style="width: 224px;" class="inp">Active</div>
      <p style="margin: 0; font-size: 0.8125rem; line-height: 1.25rem; color: oklch(0.51 0.014 68); text-wrap: pretty;">
        A plant that died or moved on stays in the collection under its own status — its history is the point. Deleting is for a record that should never have existed.
      </p>
      <div style="display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; height: 44px; padding: 0 12px; margin-left: -12px; border-radius: 6px; color: oklch(0.52 0.13 47); font-size: 0.9375rem; font-weight: 500;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
        Delete this plant for good
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 8px; color: oklch(0.51 0.014 68);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="m4 18 5-4 4 3 3-2 4 3"></path></svg>
        <span class="sc">Photo</span>
      </div>
      <div style="display: flex; gap: 12px;">
        <div style="width: 80px; height: 80px; border-radius: 8px; border: 2px solid oklch(0.455 0.098 152); background: oklch(0.944 0.01 85); display: flex; align-items: center; justify-content: center; font-size: 0.8125rem; font-weight: 500; color: oklch(0.51 0.014 68);">Newest</div>
        <div style="width: 80px; height: 80px; border-radius: 8px; background: linear-gradient(160deg, oklch(0.72 0.06 152), oklch(0.45 0.07 152));"></div>
        <div style="width: 80px; height: 80px; border-radius: 8px; background: linear-gradient(160deg, oklch(0.66 0.05 120), oklch(0.4 0.06 140));"></div>
      </div>
    </div>
  </div>

  <!-- the save bar is the last thing on the page again -->
  <div style="border-top: 1px solid oklch(0.886 0.01 80); padding: 20px; display: flex; gap: 12px;">
    <div style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 6px; background: oklch(0.455 0.098 152); color: oklch(0.985 0.004 85); font-size: 1rem; font-weight: 500;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
      Save
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 16px; border-radius: 6px; border: 1px solid oklch(0.8 0.012 80); font-size: 1rem; font-weight: 500;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      Cancel
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

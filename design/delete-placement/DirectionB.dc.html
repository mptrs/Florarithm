<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,200..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    a { color: oklch(0.455 0.098 152); } a:hover { color: oklch(0.405 0.098 152); }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: oklch(0.968 0.008 85); color: oklch(0.255 0.014 65); display: flex; flex-direction: column; overflow: hidden;">

  <!-- hero photograph -->
  <div style="position: relative; height: 340px; background: linear-gradient(160deg, oklch(0.72 0.06 152), oklch(0.42 0.07 152));">
    <div style="position: absolute; inset: 16px 16px auto 16px; display: flex; align-items: flex-start; justify-content: space-between;">
      <div style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 999px; background: oklch(0.995 0.003 85 / 0.9); color: oklch(0.255 0.014 65); box-shadow: 0 4px 10px oklch(0.255 0.014 65 / 0.18);">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 999px; background: oklch(0.995 0.003 85 / 0.9); color: oklch(0.255 0.014 65); box-shadow: 0 4px 10px oklch(0.255 0.014 65 / 0.18);">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
        </div>
        <div style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 999px; background: oklch(0.995 0.003 85); color: oklch(0.255 0.014 65); box-shadow: 0 6px 14px oklch(0.255 0.014 65 / 0.22);">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.4"></circle><circle cx="12" cy="12" r="1.4"></circle><circle cx="12" cy="19" r="1.4"></circle></svg>
        </div>
      </div>
    </div>

    <!-- the menu, over the photograph -->
    <div style="position: absolute; right: 16px; top: 64px; width: 244px; background: oklch(0.995 0.003 85); border: 1px solid oklch(0.886 0.01 80); border-radius: 12px; box-shadow: 0 14px 30px oklch(0.255 0.014 65 / 0.2); overflow: hidden; z-index: 5;">
      <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; font-size: 0.9375rem;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M20 4 8.12 15.88"></path><path d="M14.47 14.48 20 20"></path><path d="M8.12 8.12 12 12"></path></svg>
        Take a cutting
      </div>
      <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; font-size: 0.9375rem;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M9 9h.01"></path><path d="M15 15h.01"></path></svg>
        Show the tag
      </div>
      <div style="height: 1px; background: oklch(0.886 0.01 80);"></div>
      <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; font-size: 0.9375rem; color: oklch(0.52 0.13 47);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
        Delete this plant
      </div>
    </div>
  </div>

  <!-- the sheet of content, riding up over the photograph -->
  <div style="flex: 1 1 0; min-height: 0; margin-top: -24px; border-radius: 16px 16px 0 0; background: oklch(0.968 0.008 85); padding: 24px 20px; display: flex; flex-direction: column; gap: 20px;">
    <div>
      <div style="font-family: 'Newsreader', Georgia, serif; font-size: 2.5rem; line-height: 2.6875rem; font-weight: 500; letter-spacing: -0.025em;">Gruyère</div>
      <div style="margin-top: -2px; font-size: 1.0625rem; line-height: 1.5rem; color: oklch(0.51 0.014 68);">Monstera deliciosa 'Ninja' albo</div>
    </div>

    <div style="display: flex; gap: 12px;">
      <div style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 8px; height: 64px; border-radius: 6px; background: oklch(0.455 0.104 236); color: oklch(0.985 0.004 85); font-size: 1.1875rem; font-weight: 600; letter-spacing: 0.12em;">WATER</div>
    </div>

    <div style="border: 1px solid oklch(0.886 0.01 80); border-radius: 12px; background: oklch(0.995 0.003 85); padding: 16px; display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 0.75rem; letter-spacing: 0.09em; font-weight: 600; text-transform: uppercase; color: oklch(0.51 0.014 68);">Rhythm</div>
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 1.375rem; font-weight: 500;">6</span>
        <span style="color: oklch(0.51 0.014 68);">days since the last drink</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

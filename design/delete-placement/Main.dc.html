<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,200..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    a { color: oklch(0.455 0.098 152); } a:hover { color: oklch(0.405 0.098 152); }
    .sc { font-family: system-ui, sans-serif; font-size: 0.75rem; line-height: 1rem; letter-spacing: 0.09em; font-weight: 600; text-transform: uppercase; color: oklch(0.51 0.014 68); }
    .fl { font-family: system-ui, sans-serif; font-size: 0.75rem; line-height: 1rem; letter-spacing: 0.09em; font-weight: 600; text-transform: uppercase; color: oklch(0.51 0.014 68); }
    .inp { display: flex; align-items: center; height: 48px; padding: 0 12px; border: 1px solid oklch(0.8 0.012 80); border-radius: 4px; background: oklch(0.995 0.003 85); font-size: 1rem; color: oklch(0.255 0.014 65); }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: oklch(0.968 0.008 85); color: oklch(0.255 0.014 65); display: flex; flex-direction: column; overflow: hidden;">

  <!-- form header -->
  <div style="display: flex; align-items: center; gap: 8px; padding: 20px 20px 0 20px;">
    <div style="width: 40px; height: 40px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: oklch(0.51 0.014 68);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
    </div>
    <h1 style="flex: 1 1 0; min-width: 0; margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 2rem; line-height: 2.25rem; font-weight: 500; letter-spacing: -0.015em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Edit Gruyère</h1>
    <div style="display: inline-flex; align-items: center; border: 1px solid oklch(0.8 0.012 80); border-radius: 4px; padding: 4px 10px; font-family: 'IBM Plex Mono', monospace; font-size: 0.8125rem; letter-spacing: 0.08em; font-weight: 500; color: oklch(0.51 0.014 68);">MON-014</div>
    <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-right: -10px; border-radius: 6px; color: oklch(0.51 0.014 68); background: oklch(0.944 0.01 85);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.4"></circle><circle cx="12" cy="12" r="1.4"></circle><circle cx="12" cy="19" r="1.4"></circle></svg>
    </div>
  </div>

  <!-- the open menu, anchored under the ⋯ -->
  <div style="position: relative; height: 0;">
    <div style="position: absolute; right: 20px; top: 6px; width: 236px; background: oklch(0.995 0.003 85); border: 1px solid oklch(0.886 0.01 80); border-radius: 12px; box-shadow: 0 12px 28px oklch(0.255 0.014 65 / 0.14); overflow: hidden; z-index: 5;">
      <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; font-size: 0.9375rem; color: oklch(0.255 0.014 65);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M9 12h6"></path><path d="M12 9v6"></path></svg>
        Take a cutting
      </div>
      <div style="height: 1px; background: oklch(0.886 0.01 80);"></div>
      <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; font-size: 0.9375rem; color: oklch(0.52 0.13 47);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
        Delete this plant
      </div>
    </div>
  </div>

  <!-- form body, dimmed under the menu -->
  <div style="flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 24px; padding: 24px 20px 0 20px; opacity: 0.45;">
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 8px; color: oklch(0.51 0.014 68);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h.01"></path><path d="M20.6 11.4 12 2.8H4v8l8.6 8.6a2 2 0 0 0 2.8 0l5.2-5.2a2 2 0 0 0 0-2.8Z"></path></svg>
        <span class="sc">What it is</span>
      </div>
      <div style="display: flex; gap: 12px;">
        <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 6px;"><span class="fl">Genus</span><div class="inp">Monstera</div></div>
        <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 6px;"><span class="fl">Species</span><div class="inp">deliciosa</div></div>
      </div>
      <div style="display: flex; gap: 12px;">
        <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 6px;"><span class="fl">Cultivar</span><div class="inp">Ninja</div></div>
        <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 6px;"><span class="fl">Variegation</span><div class="inp">albo</div></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;"><span class="fl">Name</span><div class="inp">Gruyère</div></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 8px; color: oklch(0.51 0.014 68);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        <span class="sc">Where it lives</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;"><span class="fl">Place</span><div class="inp">Living room, east window</div></div>
    </div>
  </div>

  <!-- the save bar: nothing destructive within reach of it -->
  <div style="border-top: 1px solid oklch(0.886 0.01 80); padding: 20px; display: flex; gap: 12px; opacity: 0.45;">
    <div style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 6px; background: oklch(0.455 0.098 152); color: oklch(0.985 0.004 85); font-size: 1rem; font-weight: 500;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
      Save
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 16px; border-radius: 6px; border: 1px solid oklch(0.8 0.012 80); font-size: 1rem; font-weight: 500;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      Cancel
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

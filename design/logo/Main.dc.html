<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
  />
  <style>
    * { box-sizing: border-box; }
    a { color: {{ink}}; }
    a:hover { color: {{leaf}}; }
  </style>
</helmet>

<div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: {{bg}}; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 48px; padding: 64px;">

    <div style="display: flex; align-items: center; gap: 32px;">
      <dc-import name="Mark" leaf-color="{{leaf}}" dot-color="{{leaf}}" hint-size="176px,176px"></dc-import>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div style="font-family: 'Newsreader', Georgia, 'Times New Roman', serif; font-weight: 500; font-size: 92px; line-height: 1; letter-spacing: -0.02em; color: {{ink}}; white-space: nowrap;">Florarithm</div>
        <div style="font-size: 14px; font-weight: 600; letter-spacing: 0.14em; color: {{inkMuted}};">A PLANT LOGBOOK</div>
      </div>
    </div>

    <div style="display: flex; align-items: flex-end; gap: 40px;">

      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
        <div style="width: 128px; height: 128px; border-radius: 22px; background: {{surface}}; border: 1px solid {{line}}; display: flex; align-items: center; justify-content: center;">
          <dc-import name="Mark" leaf-color="{{leaf}}" dot-color="{{leaf}}" hint-size="84px,84px"></dc-import>
        </div>
        <div style="font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: {{inkFaint}};">APP ICON</div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
        <div style="width: 48px; height: 48px; border-radius: 10px; background: {{surface}}; border: 1px solid {{line}}; display: flex; align-items: center; justify-content: center;">
          <dc-import name="Mark" leaf-color="{{leaf}}" dot-color="{{leaf}}" hint-size="30px,30px"></dc-import>
        </div>
        <div style="font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: {{inkFaint}};">FAVICON</div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
        <div style="width: 128px; height: 128px; border-radius: 22px; background: {{surface}}; border: 1px solid {{line}}; display: flex; align-items: center; justify-content: center;">
          <dc-import name="Mark" leaf-color="{{ink}}" dot-color="{{ink}}" hint-size="84px,84px"></dc-import>
        </div>
        <div style="font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: {{inkFaint}};">SINGLE COLOUR</div>
      </div>

    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"},"$preview":{"width":1080,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    return {
      bg: dark ? 'oklch(0.19 0.008 80)' : 'oklch(0.968 0.008 85)',
      surface: dark ? 'oklch(0.238 0.009 80)' : 'oklch(0.995 0.003 85)',
      line: dark ? 'oklch(0.322 0.01 80)' : 'oklch(0.886 0.01 80)',
      ink: dark ? 'oklch(0.945 0.008 85)' : 'oklch(0.255 0.014 65)',
      inkMuted: dark ? 'oklch(0.735 0.012 80)' : 'oklch(0.51 0.014 68)',
      inkFaint: dark ? 'oklch(0.575 0.012 78)' : 'oklch(0.655 0.012 72)',
      leaf: dark ? 'oklch(0.76 0.11 152)' : 'oklch(0.455 0.098 152)',
      water: dark ? 'oklch(0.76 0.105 236)' : 'oklch(0.455 0.104 236)',
    };
  }
}
</script>
</body>
</html>
